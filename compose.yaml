services:
  db:
    image: postgres:16-alpine
    container_name: pg-ticketera
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketera_db
      POSTGRES_USER: user_ticketera
      POSTGRES_PASSWORD: pass_ticketera
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_ticketera -d ticketera_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: